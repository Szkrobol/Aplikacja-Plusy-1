<section class="flex flex-col gap-3 rounded-xl border border-slate-200 bg-white p-4">
  <div>
    <h2 class="font-medium text-slate-900">Rezygnacja z podpunktów</h2>
    <p class="mt-1 text-sm leading-relaxed text-slate-600">
      Nie chcesz robić wszystkich przydzielonych Ci podpunktów? Zaznacz te, z których rezygnujesz.
      Zwolnią się dla innych w turze 2. Jeśli nie zaznaczysz niczego, nic się nie zmieni.
    </p>
  </div>

  <ul class="flex flex-wrap gap-2">
    @for (item of items(); track item.id) {
      <li>
        <button
          type="button"
          [class]="chipBase + ' ' + (isChosen(item.id) ? chipGiveUp : chipIdle)"
          [attr.aria-pressed]="isChosen(item.id)"
          [attr.aria-label]="'Podpunkt ' + item.label + (isChosen(item.id) ? ', rezygnuję' : '')"
          [disabled]="busy()"
          (click)="toggle(item.id)"
        >
          {{ item.label }}
        </button>
      </li>
    }
  </ul>

  <div>
    <button
      mat-flat-button
      type="button"
      [disabled]="busy() || chosenCount() === 0"
      (click)="release()"
    >
      {{ busy() ? 'Zapisywanie…' : 'Zrezygnuj z zaznaczonych (' + chosenCount() + ')' }}
    </button>
  </div>
</section>
